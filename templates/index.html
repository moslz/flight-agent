<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────── -->
  <header>
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
      <span>FlightAgent</span>
    </div>
    <div class="header-actions">
      <button id="new-chat-btn" class="header-tag" title="Start a new conversation">New chat</button>
      <div class="header-tag">powered by Claude</div>
    </div>
  </header>

  <!-- ── Main chat area ─────────────────────────────────── -->
  <main>
    <div id="chat-window">

      <!-- Welcome message -->
      <div class="message agent-message" id="welcome">
        <div class="message-bubble">
          <p>Hello! I'm your AI flight assistant. Tell me where you want to go and when — I'll find the best options for you.</p>
          <p class="hint">Try: <em>"Flights from Berlin to Tokyo on July 15th"</em></p>
        </div>
      </div>

    </div>
  </main>

  <!-- ── Input bar ───────────────────────────────────────── -->
  <footer>
    <div class="input-row">
      <textarea
        id="user-input"
        placeholder="Ask about flights..."
        rows="1"
        autofocus
      ></textarea>
      <button id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
